name: Deploy AIREST to GitHub Pages

run-name: Deploy ${{ inputs.ref }} to GitHub Pages by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build and publish
        required: true
        default: landing_new
        type: choice
        options:
          - landing_new
          - main

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a newer push supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the production build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
