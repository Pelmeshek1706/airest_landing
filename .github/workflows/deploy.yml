name: Deploy AIREST to GitHub Pages

run-name: Deploy ${{ inputs.ref }} to GitHub Pages by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build and publish
        required: true
        default: landing_new
        type: choice
        options:
          - landing_new
          - main

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a newer push supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the production build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify custom domain
        env:
          SITE_URL: https://www.airest.health/
        run: |
          echo "CHECK: Waiting 60 seconds for the public site to update..."
          sleep 60

          echo "CHECK: URL=$SITE_URL | expected=HTTP 200 | attempts=5 | retry-delay=15s"

          for attempt in {1..5}; do
            set +e
            metrics="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code} %{time_total} %{url_effective}' \
              --location --max-time 20 "$SITE_URL")"
            curl_exit=$?
            set -e

            read -r status response_time final_url <<< "$metrics"

            if [ "$curl_exit" -ne 0 ]; then
              echo "::warning::CHECK $attempt/5: curl failed (exit $curl_exit); HTTP ${status:-000}; URL=$SITE_URL"
            else
              echo "CHECK $attempt/5: HTTP $status in ${response_time}s | $final_url"
            fi

            if [ "$curl_exit" -eq 0 ] && [ "$status" = "200" ]; then
              echo "PASS: $SITE_URL returned HTTP 200 in ${response_time}s."
              exit 0
            fi

            echo "CHECK: retrying in 15 seconds..."
            sleep 15
          done

          echo "::error title=Custom-domain verification failed::Expected HTTP 200 from $SITE_URL after 5 attempts."
          echo "FAIL: $SITE_URL did not return HTTP 200."
          exit 1
